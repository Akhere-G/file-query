# Throwaway Postgres + pgvector for the automated tests. Never point this at real data.
services:
  test-db:
    image: pgvector/pgvector:pg16
    environment:
      POSTGRES_USER: test
      POSTGRES_DB: filequery_test
      POSTGRES_HOST_AUTH_METHOD: trust
    ports:
      - "127.0.0.1:5433:5432"
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U test -d filequery_test"]
      interval: 2s
      timeout: 3s
      retries: 20
